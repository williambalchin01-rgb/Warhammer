name: Sync rules data

# BSData re-scrapes the Munitorum Field Manual daily and maintains the Kill
# Team catalogues by hand, so check once a day and open a PR when either has
# changed.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Regenerate 40k points from the Munitorum Field Manual
        run: python3 tools/sync-mfm.py

      - name: Regenerate Kill Team data from the BSData catalogues
        run: python3 tools/sync-killteam.py

      - name: Bump the service worker cache so clients pick the new data up
        run: |
          if ! git diff --quiet -- data; then
            n=$(grep -oP 'painting-v\K[0-9]+' sw.js)
            sed -i "s/painting-v$n/painting-v$((n + 1))/" sw.js
          fi

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: rules-data-update
          title: "Rules data update"
          commit-message: "Update points and Kill Team data"
          body: |
            Regenerated `data/` from [BSData/wh40k-11e-mfm](https://github.com/BSData/wh40k-11e-mfm)
            (40k points) and [BSData/wh40k-killteam](https://github.com/BSData/wh40k-killteam) (Kill Team).
            Check the diff for what changed before merging.
          add-paths: |
            data
            sw.js
